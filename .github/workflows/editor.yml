name: editor

on:
  push:
    branches: [main]
    paths:
      - 'scratch-gui/**'
      - '.github/workflows/editor.yml'
  pull_request:
    paths:
      - 'scratch-gui/**'
      - '.github/workflows/editor.yml'
  workflow_dispatch:

jobs:
  build:
    # The editor is a TurboWarp checkout, so a full install + webpack 4 build is
    # slow, and the build succeeding is the real gate. Lint is advisory here:
    # upstream's eslint config reports ~75 pre-existing JSDoc/operator errors on
    # src/lib/collab, so a blocking lint step would fail every PR on day one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: scratch-gui/package-lock.json

      - run: npm ci
        working-directory: scratch-gui
        timeout-minutes: 20

      - name: Lint the collab client (advisory)
        run: npx eslint src/lib/collab --ext .js,.jsx
        working-directory: scratch-gui
        continue-on-error: true

      # This one is a real gate, unlike the lint above. It needs no browser and
      # no VM — it drives the extension against a stubbed runtime and bridge —
      # and it covers the failures that manual play-testing does not reach:
      # two messages in a single frame, a second project load, a loop fast
      # enough to flood the socket.
      - name: Together extension
        run: node src/lib/libraries/extensions/together/together.test.mjs
        working-directory: scratch-gui

      - name: Build
        run: npm run build
        working-directory: scratch-gui
        timeout-minutes: 30
        env:
          # webpack 4 against modern Node's OpenSSL, and the bundle needs headroom
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=4096

name: Bug report
description: Something is broken or behaves in a way it shouldn't
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. You don't have to fill in every box — what
        you were doing and what happened is enough to get started.

        If it's a **security** problem (someone could get into another account,
        see private work, or reach a child), please don't file it here — see
        [SECURITY.md](https://github.com/Nickalus12/SquiggleGames/blob/main/SECURITY.md).

  - type: textarea
    id: doing
    attributes:
      label: What were you doing?
      placeholder: Two of us were editing the same sprite in a room called "castle"; I dragged a block into a loop.
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      placeholder: The block appeared on my screen but never showed up on theirs, and after a minute my blocks jumped back to where they were.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false

  - type: input
    id: room
    attributes:
      label: Room name (if it happened in a room)
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where in Squiggle?
      options:
        - Editor — blocks
        - Editor — paint / costumes / sounds
        - Editor — sprites or the stage
        - Multiplayer sync between players
        - Together extension (multiplayer games)
        - Accounts, signing in, recovery
        - Publishing, Explore, Play
        - The website itself (home, profile, notifications)
        - Self-hosting / running it myself
        - Not sure
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows 11 / Safari on an iPad
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a recording, or console errors (F12 → Console) all help. Drag files straight in.
    validations:
      required: false
